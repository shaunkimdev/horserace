name: Web and Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/android-app/.android
      ANDROID_AVD_HOME: ${{ github.workspace }}/android-app/.android/avd
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android-app/**/*.gradle
            android-app/gradle/wrapper/gradle-wrapper.properties
      - name: Install web dependencies
        run: npm ci --prefix game
      - name: Check web game
        working-directory: game
        run: |
          npm test
          npm run lint
          npx tsc --noEmit
          npm run build
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # This Java/WebView app does not use the preinstalled multi-gigabyte NDKs.
          # Reclaim space only inside this disposable GitHub-hosted runner's SDK.
          test "$GITHUB_ACTIONS" = true
          test "$(realpath "$SDK_ROOT")" = /usr/local/lib/android/sdk
          if [ -d "$SDK_ROOT/ndk" ]; then rm -rf -- "$SDK_ROOT/ndk"; fi
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -n "$SDK_MANAGER"
          echo "$(dirname "$SDK_MANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'system-images;android-34;google_apis;x86_64'
          sudo chmod 666 /dev/kvm
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify android-app/releases/DrawDerby-debug.apk
          (cd android-app/releases && sha256sum -c DrawDerby-debug.apk.sha256)
      - name: Build APK and check Android code
        working-directory: android-app
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
          node scripts/verify-bundle.mjs
      - name: Start multiplayer server
        run: |
          mkdir -p android-app/outputs
          npm run dev --prefix game -- --hostname 0.0.0.0 --port 3000 > android-app/outputs/game-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          npm run test:server --prefix game
      - name: Start Android 14 emulator
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name DrawDerby_CI --package 'system-images;android-34;google_apis;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/DrawDerby_CI.avd"
          test -f "$ANDROID_AVD_HOME/DrawDerby_CI.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-34\n' "$ANDROID_AVD_HOME/DrawDerby_CI.avd" > "$ANDROID_AVD_HOME/DrawDerby_CI.ini"
          sed -i -e 's/^hw.lcd.width=.*/hw.lcd.width=480/' -e 's/^hw.lcd.height=.*/hw.lcd.height=800/' -e 's/^hw.lcd.density=.*/hw.lcd.density=160/' "$ANDROID_AVD_HOME/DrawDerby_CI.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -avd DrawDerby_CI -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -gpu swiftshader -feature -Vulkan -skin 480x800 -memory 2048 -cores 2 > android-app/outputs/emulator.log 2>&1 &
          EMULATOR_PID=$!
          for attempt in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat android-app/outputs/emulator.log; exit 1; fi
            if adb get-state > /dev/null 2>&1 && [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Exercise offline racing and multiplayer in the installed app
        working-directory: android-app
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -e serverUrl http://10.0.2.2:3000 com.drawderby.app.test/androidx.test.runner.AndroidJUnitRunner | tee outputs/instrumentation.txt
          grep -E 'OK \(3 tests\)' outputs/instrumentation.txt
      - name: Collect device logs
        if: always()
        run: |
          mkdir -p android-app/outputs
          if adb get-state > /dev/null 2>&1; then
            adb logcat -d -b all > android-app/outputs/android-device.log
            adb logcat -d -s DrawDerby:E AndroidRuntime:E > android-app/outputs/android-errors.log
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-apk-and-checks
          path: |
            android-app/app/build/outputs/apk/
            android-app/app/build/reports/
            android-app/outputs/
